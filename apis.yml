aid: openprose
name: Openprose
description: >-
  OpenProse, Inc. builds an open-source (MIT) programming language for AI
  sessions: standing AI jobs are declared as durable Markdown contracts
  (`*.prose.md` files) that state what should stay true, and the system works
  out how much model work it takes to keep it true. The language ships as an
  agent skill (`open-prose`) that runs on any compliant agent host such as
  Claude Code, Codex, or OpenCode, and is paired with Reactor — a deterministic
  harness (`@openprose/reactor` SDK plus the `@openprose/reactor-cli` `reactor`
  binary) whose model spend scales with surprise, not the clock: a render runs
  only when a node's subscribed input fingerprints move, and each commit is a
  content-addressed receipt with no LLM in the wake/commit decision. Contract
  kinds are responsibility, function, gateway, pattern, and test; Forme is the
  semantic dependency-injection layer that wires `### Requires` facets to
  `### Maintains` facets. A Y Combinator company founded in 2026 (San Francisco)
  with open-source traction; distributed as npm packages rather than a hosted
  REST API.
